# PaySecure Ltd office network: a realistic multi-department segmentation lab for SegCheck.
#
#   Guest 10.20 · Corporate 10.40 · HR 10.50 · DMZ 10.60 · Servers 10.70 · CDE 10.30 · Admin 10.80   (each /24)
#   One core firewall (x.x.x.1 on every zone) enforces the access matrix in firewall/rules.sh
#   and logs every decision (NFLOG → ulogd → syslog) to SegCheck at 10.40.0.100:5514.
#
#   SegCheck runs on an audit host with an address in Guest, Corporate, DMZ, CDE and Admin
#   (policy routing sends each source address through the firewall), like an auditor moving
#   a test laptop between VLANs. UI: http://127.0.0.1:5091
#
#   docker compose up -d --build        then        python scripts/e2e_office.py
name: segcheck-office

x-zone-service: &zone-service
  build: ./systems
  cap_add: [NET_ADMIN]
  depends_on: [firewall]

networks:
  guest: {ipam: {config: [{subnet: 10.20.0.0/24, gateway: 10.20.0.254}]}}
  corporate: {ipam: {config: [{subnet: 10.40.0.0/24, gateway: 10.40.0.254}]}}
  hr: {ipam: {config: [{subnet: 10.50.0.0/24, gateway: 10.50.0.254}]}}
  dmz: {ipam: {config: [{subnet: 10.60.0.0/24, gateway: 10.60.0.254}]}}
  servers: {ipam: {config: [{subnet: 10.70.0.0/24, gateway: 10.70.0.254}]}}
  cde: {ipam: {config: [{subnet: 10.30.0.0/24, gateway: 10.30.0.254}]}}
  admin: {ipam: {config: [{subnet: 10.80.0.0/24, gateway: 10.80.0.254}]}}

services:
  firewall:
    build: ./firewall
    cap_add: [NET_ADMIN]
    sysctls: {net.ipv4.ip_forward: "1"}
    environment: {SYSLOG_TARGET: "10.40.0.100:5514", MODE: office}
    networks:
      guest: {ipv4_address: 10.20.0.1}
      corporate: {ipv4_address: 10.40.0.1}
      hr: {ipv4_address: 10.50.0.1}
      dmz: {ipv4_address: 10.60.0.1}
      servers: {ipv4_address: 10.70.0.1}
      cde: {ipv4_address: 10.30.0.1}
      admin: {ipv4_address: 10.80.0.1}

  hr-db:
    <<: *zone-service
    environment: {GATEWAY: 10.50.0.1, SERVICES: "tcp:5432 tcp:445", NAME: hr-db}
    networks: {hr: {ipv4_address: 10.50.0.10}}
  web:
    <<: *zone-service
    environment: {GATEWAY: 10.60.0.1, SERVICES: "tcp:80 tcp:443", NAME: public-web}
    networks: {dmz: {ipv4_address: 10.60.0.10}}
  file-server:
    <<: *zone-service
    environment: {GATEWAY: 10.70.0.1, SERVICES: "tcp:445 tcp:389 tcp:8080 udp:53", NAME: file-ldap-intranet}
    networks: {servers: {ipv4_address: 10.70.0.10}}
  payment-api:
    <<: *zone-service
    environment: {GATEWAY: 10.30.0.1, SERVICES: "tcp:8443 tcp:22", NAME: payment-api}
    networks: {cde: {ipv4_address: 10.30.0.10}}
  card-db:
    <<: *zone-service
    environment: {GATEWAY: 10.30.0.1, SERVICES: "tcp:5432", NAME: card-db}
    networks: {cde: {ipv4_address: 10.30.0.20}}

  auditor:
    build:
      context: ../..
      dockerfile: lab/docker/auditor/Dockerfile
    entrypoint: ["/lab/auditor-entry.sh"]
    cap_add: [NET_ADMIN]
    volumes: ["./auditor/entry.sh:/lab/auditor-entry.sh:ro"]
    ports: ["127.0.0.1:5091:5000"]
    environment:
      SEGCHECK_CONTAINER: "1"
      SEGCHECK_SETUP_TOKEN: ${SEGCHECK_SETUP_TOKEN:-office-setup-token-change-me-0123456789abcdef}
    networks:
      guest: {ipv4_address: 10.20.0.100}
      corporate: {ipv4_address: 10.40.0.100}
      dmz: {ipv4_address: 10.60.0.100}
      cde: {ipv4_address: 10.30.0.100}
      admin: {ipv4_address: 10.80.0.100}
    depends_on: [firewall]
